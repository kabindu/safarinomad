<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Safari Dates | SafariNomad</title>
<meta name="description" content="Pick a real departure date, see seats left and book your East Africa safari in a few minutes. Pay just a $250 deposit per person.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/book.css">
</head>
<body data-page="book">

<div id="site-header"></div>

<main>

<section class="bk-section">
  <div class="wrap">
    <nav class="breadcrumb" aria-label="Breadcrumb"><a href="index.html">Home</a><i class="fa-solid fa-chevron-right"></i><a href="trips.html">Trips</a><i class="fa-solid fa-chevron-right"></i><span>Book</span></nav>
    <h1 class="bk-title">Book your safari</h1>
  </div>

  <div class="wrap bk-layout">

    <form id="bookForm" class="bk-main" novalidate>

      <!-- Trip -->
      <div class="bk-block">
        <label for="bkTrip" class="bk-h">Trip</label>
        <select id="bkTrip" name="trip" class="bk-input"></select>
      </div>

      <!-- Date -->
      <div class="bk-block" id="stepDate">
        <div class="bk-row">
          <span class="bk-h">Start date</span>
          <label class="bk-switch" id="privateWrap" hidden>
            <input type="checkbox" id="bkPrivate"><span class="bk-slider"></span><span>Private</span>
          </label>
        </div>
        <div class="cal" id="calendar">
          <div class="cal-head">
            <button type="button" class="cal-nav" id="calPrev" aria-label="Previous month"><i class="fa-solid fa-chevron-left"></i></button>
            <div class="cal-pick" translate="no"><select id="calMonth" aria-label="Month"></select><select id="calYear" aria-label="Year"></select></div>
            <button type="button" class="cal-nav" id="calNext" aria-label="Next month"><i class="fa-solid fa-chevron-right"></i></button>
          </div>
          <div class="cal-grid cal-dow" id="calDow" translate="no"></div>
          <div class="cal-grid" id="calDays" translate="no"></div>
        </div>
        <div class="cal-legend"><span><i class="lg lg-open"></i> Available</span><span><i class="lg lg-few"></i> Few seats</span></div>
      </div>

      <!-- Travellers -->
      <div class="bk-block" id="stepPeople">
        <span class="bk-h">Travellers</span>
        <div class="bk-people">
          <div class="bk-counter">
            <div><strong>Adults</strong><small>16+</small></div>
            <div class="stepper"><button type="button" data-step-for="adults" data-d="-1" aria-label="Fewer adults"><i class="fa-solid fa-minus"></i></button><output id="adults">2</output><button type="button" data-step-for="adults" data-d="1" aria-label="More adults"><i class="fa-solid fa-plus"></i></button></div>
          </div>
          <div class="bk-counter">
            <div><strong>Children</strong><small id="childNote">5–15</small></div>
            <div class="stepper"><button type="button" data-step-for="children" data-d="-1" aria-label="Fewer children"><i class="fa-solid fa-minus"></i></button><output id="children">0</output><button type="button" data-step-for="children" data-d="1" aria-label="More children"><i class="fa-solid fa-plus"></i></button></div>
          </div>
        </div>
      </div>

      <!-- Details -->
      <div class="bk-block" id="stepDetails">
        <span class="bk-h">Your details</span>
        <div class="bk-fields">
          <input id="bkName" name="name" class="bk-input" type="text" placeholder="Full name" aria-label="Full name" autocomplete="name" required>
          <input id="bkEmail" name="email" class="bk-input" type="email" placeholder="Email" aria-label="Email" autocomplete="email" required>
          <input id="bkPhone" name="phone" class="bk-input full" type="tel" placeholder="Phone / WhatsApp (optional)" aria-label="Phone or WhatsApp (optional)" autocomplete="tel">
        </div>
      </div>

      <div id="bookStatus" class="contact-status" aria-live="polite"></div>
    </form>

    <!-- Receipt -->
    <aside class="bk-summary" id="summary">
      <div class="rc-trip">
        <img id="sumImg" src="images/serengeti-acacia.jpg" alt="">
        <div><h3 id="sumTitle"></h3><span id="sumDays"></span></div>
      </div>
      <dl class="rc-list">
        <div><dt>Dates</dt><dd id="sumDates" translate="no">–</dd></div>
        <div><dt>Travellers</dt><dd id="sumPeople" translate="no"></dd></div>
        <div><dt>Per person</dt><dd id="sumPP"></dd></div>
      </dl>
      <div class="rc-total"><span>Total</span><strong id="sumTotal"></strong></div>
      <div class="rc-small"><span>Deposit after confirmation</span><b id="sumDeposit"></b></div>
      <label class="bk-agree"><input type="checkbox" id="bkAgree" required> <span>I accept the <a href="about.html#faqs" target="_blank">booking terms</a></span></label>
      <button class="btn bk-submit" type="submit" form="bookForm" id="bookBtn">Request booking</button>
      <p class="rc-note"><i class="fa-solid fa-lock"></i> No payment today</p>
    </aside>

    <!-- Phones: total and button always in reach -->
    <div class="bk-bar" id="bkBar">
      <div class="bk-bar-info"><strong id="barTotal"></strong><span id="barDates" translate="no"></span></div>
      <button class="btn btn-sm" type="submit" form="bookForm" id="barBtn">Request booking</button>
    </div>

    <!-- Confirmation receipt -->
    <div class="bk-done" id="done" hidden>
      <div class="bk-done-icon"><i class="fa-solid fa-check"></i></div>
      <h2>Booking received</h2>
      <p>We'll confirm by email within 24 hours.</p>
      <div class="rc-card" id="doneCard"></div>
      <div class="bk-done-actions">
        <button type="button" class="btn btn-soft" id="icsBtn"><i class="fa-regular fa-calendar-plus"></i> Add to calendar</button>
        <button type="button" class="btn btn-soft" onclick="window.print()"><i class="fa-solid fa-print"></i> Print</button>
      </div>
    </div>

  </div>
</section>

</main>

<div id="site-footer"></div>

<script src="js/data.js"></script>
<script src="js/content.js"></script>
<script src="js/i18n.js"></script>
<script src="js/layout.js"></script>
<script src="js/main.js"></script>
<script src="js/search.js"></script>
<script src="js/assistant.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
